<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TIBOX · Herramientas</title>
<style id="authHide">html{visibility:hidden}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070C1A; --panel:rgba(15,23,42,0.55); --panel-2:rgba(11,17,32,0.75);
  --border:rgba(255,255,255,0.08); --text:#F1F5F9; --muted:#8592AE; --muted-2:#52607D;
  --amber:#FF8A00; --blue:#0EA5E9;
  --sans:'Plus Jakarta Sans',-apple-system,sans-serif;
  --fs-3xs:0.625rem; --fs-xs:0.75rem; --fs-sm:0.8125rem; --fs-md:0.875rem;
  --fs-lg:1rem; --fs-xl:1.25rem; --fs-2xl:1.75rem; --fs-3xl:2.5rem;
  --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:22px; --sp-6:30px; --sp-7:40px;
  --radius-md:12px; --radius-lg:16px; --radius-xl:22px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{font-size:16px}
body{
  background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;
  -webkit-font-smoothing:antialiased;position:relative;overflow-x:hidden;
  display:flex;flex-direction:column;
}
body::before{content:'';position:fixed;inset:0;z-index:-2;pointer-events:none;}
@media (min-width:721px){
  body::before{
    background:
      linear-gradient(rgba(7,12,26,.72),rgba(7,12,26,.72)),
      url('img/fondo.png');
    background-size:cover;background-position:center;background-repeat:no-repeat;
  }
}
body::after{
  content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(42vw circle at 14% 10%,rgba(255,138,0,0.10),transparent 60%),
    radial-gradient(46vw circle at 86% 18%,rgba(14,165,233,0.13),transparent 60%),
    radial-gradient(38vw circle at 50% 100%,rgba(14,165,233,0.06),transparent 60%);
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

.topbar{
  display:flex;align-items:center;padding:var(--sp-4) var(--sp-6);
  border-bottom:1px solid var(--border);
}
.tibox-logo{display:block;height:22px;width:auto}
.auth-box{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:var(--fs-xs);color:var(--muted)}
.auth-out{
  font:inherit;font-weight:700;color:var(--text);background:rgba(255,255,255,.06);
  border:1px solid var(--border);border-radius:8px;padding:6px 12px;cursor:pointer;
}
.auth-out:hover{background:rgba(255,255,255,.12)}
@media (max-width:520px){.auth-email{display:none}}

main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:var(--sp-7) var(--sp-5) 70px}

.hub-head{max-width:46rem;text-align:center;margin-bottom:var(--sp-7)}
.eyebrow{
  font-size:var(--fs-3xs);letter-spacing:.16em;color:var(--muted);text-transform:uppercase;
  display:inline-flex;align-items:center;gap:8px;margin-bottom:var(--sp-3);
}
.eyebrow::before,.eyebrow::after{content:'';width:14px;height:1px;background:var(--muted-2)}
.hub-head h1{
  font-size:var(--fs-3xl);font-weight:800;letter-spacing:-.02em;margin:0 0 10px;
  text-wrap:balance;
}
.hub-head p{color:var(--muted);font-size:var(--fs-lg);line-height:1.5;margin:0;max-width:34rem;margin-inline:auto}

.card-grid{
  display:grid;grid-template-columns:repeat(2,minmax(0,300px));gap:var(--sp-5);
  width:100%;max-width:660px;
}
@media (max-width:640px){.card-grid{grid-template-columns:1fr;max-width:340px}}

.hub-card{
  --glow:var(--blue);
  display:flex;flex-direction:column;align-items:flex-start;gap:var(--sp-3);
  padding:var(--sp-6) var(--sp-5) var(--sp-5);border-radius:var(--radius-xl);
  background:var(--panel);border:1px solid var(--border);border-bottom:2px solid var(--glow);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:0 1px 0 0 rgba(255,255,255,.04) inset,0 20px 40px -24px rgba(0,0,0,.6),0 14px 26px -18px var(--glow);
  text-decoration:none;color:inherit;
  transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;
}
.hub-card:hover,.hub-card:focus-visible{
  transform:translateY(-3px);
  box-shadow:0 1px 0 0 rgba(255,255,255,.06) inset,0 24px 44px -20px rgba(0,0,0,.65),0 18px 32px -14px var(--glow);
}
.hub-card:focus-visible{outline:none;border-color:var(--glow)}
.hub-card.acc-amber{--glow:var(--amber)}
.hub-card.acc-blue{--glow:var(--blue)}

.hub-card-icon{
  width:42px;height:42px;border-radius:11px;flex:none;
  display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--glow) 18%,transparent);color:var(--glow);
}
.hub-card-icon svg{width:21px;height:21px}

.hub-card h2{font-size:var(--fs-2xl);font-weight:800;margin:0;letter-spacing:-.01em}
.hub-card p.desc{color:var(--muted);font-size:var(--fs-sm);line-height:1.5;margin:0;flex:1}
.hub-card-cta{
  font-size:var(--fs-xs);font-weight:700;color:var(--glow);
  display:inline-flex;align-items:center;gap:6px;margin-top:2px;
}
.hub-card-cta svg{width:13px;height:13px;transition:transform .18s ease}
.hub-card:hover .hub-card-cta svg{transform:translateX(3px)}

footer{padding:var(--sp-5);text-align:center;color:var(--muted-2);font-size:var(--fs-3xs);letter-spacing:.04em}
</style>
</head>
<body>

<div class="topbar">
  <img class="tibox-logo" src="tabletop/assets/logo-tibox-ok.png" alt="TIBOX">
  <div class="auth-box">
    <span class="auth-email" data-auth-email></span>
    <button type="button" class="auth-out" data-auth-signout>Salir</button>
  </div>
</div>

<main>
  <div class="hub-head">
    <span class="eyebrow">TIBOX</span>
    <h1>¿Qué necesitas hoy?</h1>
    <p>Elige una herramienta para continuar.</p>
  </div>

  <div class="card-grid">
    <a class="hub-card acc-amber" href="tabletop/index.html">
      <div class="hub-card-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z"/>
          <path d="M9.5 12l1.8 1.8 3.2-3.6"/>
        </svg>
      </div>
      <h2>Tabletop</h2>
      <p class="desc">Ejercicio de simulación de respuesta a incidentes de ciberseguridad.</p>
      <span class="hub-card-cta">Entrar
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </span>
    </a>

    <a class="hub-card acc-blue" href="sgc/index.html">
      <div class="hub-card-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="6" y="4" width="12" height="17" rx="2"/>
          <path d="M9 4V3a1 1 0 011-1h4a1 1 0 011 1v1"/>
          <path d="M9 12l2 2 4-4"/>
        </svg>
      </div>
      <h2>SGC</h2>
      <p class="desc">Cumplimiento CIP — seguimiento de requerimientos y evidencias.</p>
      <span class="hub-card-cta">Entrar
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </span>
    </a>
  </div>
</main>

<footer>TIBOX · Soluciones tecnológicas</footer>

<script src="tabletop/js/multiplayer/firebase-config.js"></script>
<script type="module" src="auth/guard.js"></script>

</body>
</html>
