<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SGC · No disponible</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070C1A; --panel:rgba(15,23,42,0.55); --border:rgba(255,255,255,0.08);
  --text:#F1F5F9; --muted:#8592AE; --blue:#0EA5E9;
  --sans:'Plus Jakarta Sans',-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;
  display:flex;align-items:center;justify-content:center;text-align:center;
  padding:24px;
}
.box{
  max-width:26rem;padding:36px 30px;border-radius:16px;
  background:var(--panel);border:1px solid var(--border);
}
.box h1{font-size:1.25rem;font-weight:800;margin:0 0 10px}
.box p{color:var(--muted);font-size:0.9rem;line-height:1.5;margin:0 0 22px}
.box a{
  display:inline-flex;align-items:center;gap:6px;color:var(--blue);
  font-size:0.85rem;font-weight:700;text-decoration:none;
}
</style>
</head>
<body>
  <div class="box">
    <h1>Herramienta no disponible</h1>
    <p>El SGC está deshabilitado temporalmente.</p>
    <a href="../index.html">&larr; Volver al inicio</a>
  </div>
</body>
</html>
